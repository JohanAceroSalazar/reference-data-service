name: Reference Data event contracts

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/contracts/events/**'
      - '.github/workflows/event-contracts.yml'
  push:
    branches: [hu-01-dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Run unit and contract tests
        run: go test ./...
